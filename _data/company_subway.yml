- id: datadog
  name: Datadog
  case: Unicron · verified live optimisation
  published: '2026-03-09'
  source: https://www.datadoghq.com/blog/ai/fully-autonomous-optimization/
  sourceSection: Five-stage pipeline
  kind: Reported bounded evaluation
  group: runtime
  steps:
  - station: context
    label: Specialise target workload
    actor: Evolution system
    detail: Bind organisation and aggregation configuration into the candidate function.
  - station: change
    label: Evolve code variants
    actor: LLM agent
    detail: BitsEvolve searches for improved aggregation implementations.
  - station: proof
    label: Prove codec safety properties
    actor: Verus
    detail: Formal proofs cover specified properties of codec libraries the evolved code calls.
  - station: shadow
    label: Compare held-back traffic
    actor: Runtime
    detail: Reject candidates whose output hash differs from the baseline on validation messages.
  - station: hotswap
    label: Hot-swap verified WASM
    actor: Runtime
    detail: The reported system installs accepted modules in running aggregation services.
  tools:
  - name: BitsEvolve / Unicron
    relationship: Datadog systems
  - name: Verus
    relationship: Formal-verification tool used
  - name: WASM / Wasmtime
    relationship: Runtime isolation and execution
  boundary: Two evaluated workloads; codec proofs and sampled output equality are different evidence. No proof of arbitrary
    application correctness is claimed.
  loop: ''
