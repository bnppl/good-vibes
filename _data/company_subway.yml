  loop: ''
- id: posthog
  name: PostHog
  case: Self-driving team · issue to merged PR
  published: '2026-09-15'
  source: https://posthog.com/blog/self-driving-loops
  sourceSection: The issues → reports → PRs loop
  kind: Reported team use
  group: delivery
  steps:
  - station: plan
    label: Issue & readiness scout
    actor: Human + scout
    detail: A human writes intended behaviour; a scout checks scope, blockers and duplication.
  - station: change
    label: Implement ready work
    actor: Agent workflow
    detail: Ready reports start implementation tasks.
  - station: pr
    label: Propose a change
    actor: Agent workflow
    detail: The account links a concrete rename-feature PR to its source issue.
  - station: human
    label: Review the result
    actor: Human
    detail: The author checks and approves the resulting change.
  - station: merge
    label: Merge approved PR
    actor: Team
    detail: The cited example merged after approval.
  tools:
  - name: Issue-readiness scout
    relationship: Internal team workflow
  - name: PostHog skills / MCP
    relationship: Used in the reported loops
  boundary: This is one team’s issue-to-PR loop. No CI, test-first or deployment station is added from separate PostHog articles.
  loop: ''
- id: 37signals
  name: 37signals
  case: Lexxy · browser red/green
  published: '2026-09-28'
  source: https://dev.37signals.com/lexxy-1-0/
  sourceSection: Agents
  kind: Reported team use
  group: repair
  steps:
  - station: before
    label: Write and fail a browser test
    actor: Agent workflow
    detail: The Lexxy report explicitly describes observing a failing test.
  - station: change
    label: Fix the behaviour
    actor: Agent workflow
    detail: Implementation addresses the failing editor behaviour.
  - station: checks
    label: Observe a passing browser test
    actor: Playwright
    detail: The browser suite provides realistic clipboard, keyboard and focus feedback.
  tools:
  - name: Claude
    relationship: Reported use from project start
  - name: Playwright
    relationship: Adopted for the browser feedback loop
  boundary: This is the documented Lexxy loop, not every 37signals project. Separate sandbox/branch bug validation is described
    but not forced into this sequence.
  loop: Browser red → fix → browser green.
- id: block
  name: Block
  case: Actionable CI · eligible autofix
  published: '2026-02-23'
  source: https://engineering.block.xyz/blog/actionable-ci
  sourceSection: 'Layer 3: Agentic Autofix'
  kind: Reported team use
  group: repair
  steps:
  - station: context
    label: Analyse failure & check eligibility
    actor: Tools + human
    detail: Static rules and model analysis interpret CI failures; a developer explicitly initiates eligible autofix.
  - station: change
    label: Generate a fix
    actor: Goose
    detail: A headless agent receives the failure analysis.
  - station: pr
    label: Open draft PR
    actor: Goose
    detail: The proposed repair is submitted as a draft.
  - station: ci
    label: Validate on CI
    actor: CI + agent
    detail: Failures return to Goose up to a configured retry limit.
  - station: human
    label: Promote for review
    actor: Harness
    detail: Passing drafts become reviewable only if the original branch has not changed.
  tools:
  - name: Actionable CI
    relationship: Built by Block DX
  - name: goose
    relationship: Block’s agent, used headlessly
  boundary: If a developer has already fixed the branch, the draft is closed. Ready for review is not approval, merge or deployment.
  loop: CI failures trigger bounded repair retries.
- id: shopify
  name: Shopify
  case: River · vulnerability remediation
  published: '2026-09-02'
  source: https://shopify.engineering/river-vulnerability-remediation
  sourceSection: Validate live state; Repair; Freshness; Closure
  kind: Reported team use
  group: repair
  steps:
  - station: context
    label: Validate live finding / PR state
    actor: River
    detail: Check the ledger against current code and tracker state; stop if already resolved.
  - station: change
    label: Repair on current head
    actor: River
    detail: Rebase or prepare a narrow fix only for a still-active vulnerability.
  - station: ci
    label: Recheck the current patch
    actor: CI + River
    detail: Fresh heads retrigger checks; stale evidence cannot justify closure.
  - station: human
    label: Owner decisions & approval
    actor: Engineers
    detail: Code owners retain product-risk decisions, approval and merge responsibility.
  - station: merge
    label: Freshness-gated merge
    actor: Workflow
    detail: The remediation workflow follows the approved change through merge.
  - station: closure
    label: Verify on repository head
    actor: River
    detail: Check resulting code and dependency state before marking the finding resolved.
  tools:
  - name: River
    relationship: Internal Shopify agent
  - name: Slack threads / work ledger
    relationship: Used for investigation and handoff
  boundary: Only the remediation route is mapped. Post-merge repository verification is not production telemetry or proof
    of every security property.
  loop: Recheck changing repository and PR state on later runs.
- id: mozilla
  name: Mozilla
  case: Firefox · Anthropic red-team findings
  published: '2026-03-06'
  source: https://blog.mozilla.org/en/firefox/hardening-firefox-anthropic-red-team/
  sourceSection: An emerging technique, pressure-tested by Firefox engineers
  kind: Reported collaboration
  group: repair
  steps:
  - station: reproduce
    label: Receive reproducible findings
    actor: Anthropic red team
    detail: AI-assisted reports arrive with minimal executable test cases.
  - station: human
    label: Validate findings
    actor: Mozilla engineers
    detail: Firefox engineers reproduce and validate the submitted bugs.
  - station: change
    label: Prepare security fixes
    actor: Mozilla engineers
    detail: Engineers land patches in response to validated reports.
  - station: ship
    label: Ship Firefox fixes
    actor: Mozilla
    detail: The report states fixes shipped in Firefox 148.
  tools:
  - name: Claude
    relationship: Used by the external Anthropic red team
  - name: Minimal reproductions
    relationship: Supplied with reports
  boundary: AI discovery belongs to the collaborating red team; the source does not establish AI-written Firefox patches.
  loop: ''
- id: duolingo
  name: Duolingo
  case: iOS · scheduled test backfill
  published: '2026-06-24'
  source: https://blog.duolingo.com/ai-ios-unit-test-generation-pipeline/
  sourceSection: Scheduled backfill; PR lifecycle workflow
  kind: Reported team use
  group: assurance
  steps:
  - station: plan
    label: Score and filter Swift files
    actor: Temporal workflow
    detail: Coverage and file heuristics select candidates, excluding duplicates and cooldowns.
  - station: change
    label: Generate tests and mocks
    actor: Claude Code
    detail: Remote Linux workers generate test code but cannot compile Swift locally.
  - station: pr
    label: Open generated-test PR
    actor: Workflow
    detail: The PR is recorded for lifecycle management.
  - station: ci
    label: Repair from CI results
    actor: CI + agents
    detail: A lifecycle manager routes build failures to repair, with retry limits and cooldowns.
  - station: human
    label: Assign reviewer / enable auto-merge
    actor: Lifecycle manager
    detail: Green CI triggers reviewer assignment and enables auto-merge; the reviewer handles the PR.
  tools:
  - name: Temporal workflows
    relationship: Built around the test-generation system
  - name: Claude Code
    relationship: Used remotely
  - name: S3 state store
    relationship: Coordinates workflow state
  boundary: This is test generation for existing code, not test-first feature development. Enabling auto-merge is not a claim
    of unconditional immediate merge.
  loop: CI repair is bounded; rejected or exhausted candidates enter cooldown.
- id: cloudflare
  name: Cloudflare
  case: Merge-request AI review
  published: '2026-04-20'
  source: https://blog.cloudflare.com/ai-code-review/
  sourceSection: Plugin architecture; Coordinator; GitLab actions
  kind: Reported team use
  group: assurance
  steps:
  - station: pr
    label: Merge request triggers review
    actor: GitLab CI
    detail: The existing MR starts the reviewer workflow.
  - station: context
    label: Assemble MR context
    actor: Plugins
    detail: VCS context and repository instructions configure the run.
  - station: ai-review
    label: Specialists + coordinator
    actor: Models
    detail: Specialist sessions review aspects; a coordinator consolidates and filters findings.
  - station: findings
    label: Publish review verdict
    actor: Review system
    detail: The system posts findings and sets or revokes its own bot approval.
  tools:
  - name: OpenCode reviewer / plugins
    relationship: Built internally on OpenCode
  - name: AI Gateway / Workers
    relationship: Supporting internal control plane
  boundary: This is automated review, not code generation. No test, implementation, human-approval or deployment step is invented.
