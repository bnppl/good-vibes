checked: '2026-10-27'
window: Publications from 1 October 2025; cases retain their own dates.
cases:
- id: stripe
  name: Stripe
  case: Minions · unattended coding
  published: '2026-02-19'
  source: https://stripe.dev/blog/minions-stripes-one-shot-end-to-end-coding-agents-part-2
  sourceSection: Devboxes; Blueprints; Feedback loops
  kind: Reported team use
  group: delivery
  steps:
  - station: context
    label: Task, context & devbox
    actor: Harness
    detail: A bounded task runs in an isolated standard developer environment with scoped rules.
  - station: change
    label: Implement task
    actor: Agent
    detail: Blueprints combine model reasoning with deterministic operations.
  - station: checks
    label: Local checks
    actor: Deterministic
    detail: Configured linters and relevant local checks precede CI.
  - station: ci
    label: CI & bounded repair
    actor: Mixed
    detail: A failed run can return to the agent for one repair attempt; after the second push it returns to a human.
  - station: human
    label: Human scrutiny
    actor: Human
    detail: Minion-produced work returns for human review.
  tools:
  - name: Minions / blueprints
    relationship: Built internally
  - name: Devboxes
    relationship: Existing internal developer infrastructure
  - name: goose fork
    relationship: Customised by Stripe
  boundary: No autonomous merge or production-deployment authority is established. A returned branch can still need repair.
  loop: One agent repair opportunity after CI failure; then human handoff.
- id: spotify
  name: Spotify
  case: Honk · pre-PR verification
  published: '2025-12-09'
  source: https://engineering.atspotify.com/2025/12/feedback-loops-background-coding-agents-part-3
  sourceSection: Verification loops; LLMs in verification
  kind: Reported team use
  group: delivery
  steps:
  - station: context
    label: Bounded prompt & repository
    actor: Harness
    detail: The agent sees the relevant repository and a supplied change request.
  - station: change
    label: Rewrite code
    actor: Agent
    detail: The background agent edits within its limited environment.
  - station: checks
    label: Build / test verifiers
    actor: Deterministic
    detail: Repository-specific verifiers activate automatically and return concise results.
  - station: ai-review
    label: Prompt–diff judge
    actor: Model
    detail: A judge checks the proposed diff against the original request after other verifiers.
  - station: pr
    label: Open PR if checks pass
    actor: Harness
    detail: A stop hook runs relevant verifiers before attempting to open a PR.
  tools:
  - name: Honk
    relationship: Internal background-agent system
  - name: Verifier MCP tool / stop hook
    relationship: Built into the workflow
  boundary: The report says the judge lacked an evaluation suite. Linux-only verifier coverage at this date was incomplete;
    no deployment step is inferred.
  loop: Verifier and judge feedback can send the agent back to its change.
- id: coinbase
  name: Coinbase
  case: Figma-to-code · component workers
  published: '2026-06-03'
  source: https://www.coinbase.com/blog/automating-figma-to-code-at-coinbase
  sourceSection: The Orchestrator Pattern
  kind: Reported team use
  group: delivery
  steps:
  - station: plan
    label: Approve component plan
    actor: Human + agent
    detail: The agent reads designs and waits for engineer sign-off before code.
  - station: context
    label: Validated scaffold
    actor: Agent
    detail: A scaffold is validated and opened as a draft PR before component workers start.
  - station: change
    label: Parallel component workers
    actor: Agents
    detail: Each worker implements a focused component against the scaffold.
  - station: checks
    label: Validation gates
    actor: Tools
    detail: Each worker runs lint, typing, formatting, query and test checks.
  - station: pr
    label: Focused draft PRs
    actor: Agents
    detail: Workers open component draft PRs targeting the scaffold branch.
  tools:
  - name: Rules and prompt templates
    relationship: Published internally as skills
  - name: Reference implementation
    relationship: Team-provided example
  boundary: The scaffold contains its own checks and draft PR. Parallel workers are a fan-out, not a serial worker chain.
    Later partner-team refinement is outside this route.
  loop: ''
- id: github
  name: GitHub
  case: Copilot runtime · Rust migration
  published: 2026-09-16; updated 2026-09-23
  source: https://github.blog/ai-and-ml/generative-ai/migrating-the-github-copilot-runtime-to-rust-using-copilot/
  sourceSection: Migration plan; Testing; Lessons learned
  kind: Reported team use
  group: delivery
  steps:
  - station: before
    label: Establish behavioural tests
    actor: Engineers
    detail: Existing E2E coverage and pilot ports establish the migration machinery.
  - station: change
    label: Port components
    actor: Agents + engineers
    detail: Components are replaced incrementally, with human architectural work and oversight.
  - station: pr
    label: Port PRs
    actor: Team
    detail: The migration proceeds through separate port pull requests.
  - station: checks
    label: Existing E2E tests
    actor: Tools
    detail: Required failures prevent a port PR from landing.
  - station: merge
    label: Land incremental changes
    actor: Team
    detail: Passing ports land in the evolving mainline.
  tools:
  - name: GitHub Copilot
    relationship: Used for scoped porting and review
  - name: Existing E2E suites
    relationship: Behavioural checks retained during migration
  boundary: Coverage gaps still allowed regressions. Existing tests before a migration are not evidence of unit-test-first
    agent work.
  loop: ''
- id: grafana-labs
  name: Grafana Labs
  case: Tern · data-source externalisation
  published: '2026-09-24'
  source: https://medium.com/grafana-labs/how-and-why-were-bringing-data-sources-out-of-the-grafana-monolith-775f58eaebc3
  sourceSection: 'Streamlining the process with AI: how Tern works'
  kind: Reported team use
  group: delivery
  steps:
  - station: context
    label: Study completed migrations
    actor: Agents
    detail: Agents compare already-externalised repositories with their old locations.
  - station: guides
    label: Write migration guides
    actor: Agent
    detail: Findings become commands, decision trees and verification instructions.
  - station: plan
    label: Audit readiness
    actor: Agents
    detail: Remaining data sources are assessed for blockers and readiness.
  - station: change
    label: Execute migrations
    actor: Agents + engineers
    detail: Agents perform mechanical migration work; humans resolve hard design decisions.
  tools:
  - name: Tern
    relationship: Built by a Grafana engineer
  - name: Migration guides
    relationship: Generated and corrected during execution
  boundary: Human decisions interleave with execution. Failures feed back into guides. This route does not append a single
    universal release sequence.
  loop: Execution failures are incorporated into the next migration guide.
- id: monzo
  name: Monzo
  case: Designer-led scoped product changes
  published: '2026-03-20'
  source: https://monzo.com/blog/how-Monzo-Designers-are-shipping-safer-faster-product-improvements
  sourceSection: How designers improve quality; Designers learning to ship safely
  kind: Reported designer / team use
  group: delivery
  steps:
  - station: plan
    label: Identify a small UI change
    actor: Designer
    detail: The account starts with narrow copy and interface improvements.
  - station: change
    label: Change production code
    actor: Designer + AI
    detail: Designers use AI tools in real repositories with engineering support.
  - station: pr
    label: Raise a PR
    actor: Designer
    detail: The change enters the existing repository review process.
  - station: human
    label: Engineering review
    actor: Engineers
    detail: Code review remains mandatory.
  - station: ship
    label: Controlled production change
    actor: Authorised people
    detail: Production changes remain within existing safety and deployment guardrails.
  tools:
  - name: Cursor
    relationship: Reported designer use
  - name: GitHub
