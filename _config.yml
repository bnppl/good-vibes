title: Good Vibes
description: A learning wiki on context engineering and spec-driven development.

theme: just-the-docs

plugins:
  - jekyll-relative-links
  - jekyll-seo-tag

relative_links:
  enabled: true
  collections: true

# Apply the theme layout to all pages by default
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Navigation
nav_sort: case_insensitive
search_enabled: true

# Exclude non-content directories and tooling files from the build
exclude:
  - Gemfile
  - Gemfile.lock
  - CLAUDE.md
  - sync-to-android.sh
  - agentic-alignment.skill
  - docs/
  - skills/
  - claude-config/
  - audio-bundles/
  - memory/
  - .obsidian/
  - .claude/
  - "*.sh"
  - "*.skill"
